{% extends "base.html" %}
{% block content %}

<section class="form-card">
    <h2>Add an income source</h2>
    <p class="form-intro">Tell Budget Buddy where your money comes from.</p>

    <form method="POST">

        <label for="name">Name</label>
        <input type="text" id="name" name="name"
               placeholder="e.g. Salary, Freelance Design" required>

        <label for="income_type">Income type</label>
        <select id="income_type" name="income_type">
            <option value="fixed">Fixed — same amount every month (e.g. salary)</option>
            <option value="variable">Variable — changes month to month (e.g. freelance)</option>
        </select>

        <label for="amount">Expected monthly amount</label>
        <input type="number" id="amount" name="amount" step="0.01" min="0"
               placeholder="e.g. 15000" required>

        <button type="submit" class="btn-primary btn-block">Save Income</button>
    </form>

    <a class="back-link" href="{{ url_for('dashboard') }}">&larr; Back to home</a>
</section>

{% endblock %}
