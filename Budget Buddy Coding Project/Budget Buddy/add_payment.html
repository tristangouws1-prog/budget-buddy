{% extends "base.html" %}
{% block content %}

<section class="form-card">
    <h2>Add a bill or subscription</h2>
    <p class="form-intro">Tell Budget Buddy about a regular payment so it can remind you.</p>

    <!--
      This form sends its data to the SAME page using method="POST"
      (app.py's add_payment() function handles it).
      Each input's "name" is how Python reads that value.
      "required" stops the form submitting if a field is left empty.
    -->
    <form method="POST">
        <label for="description">What is it?</label>
        <input type="text" id="description" name="description"
               placeholder="e.g. Netflix, Rent, Phone bill" required>

        <label for="amount">How much is it? (£)</label>
        <!-- type="number" with step="0.01" lets people enter pounds AND pence. -->
        <input type="number" id="amount" name="amount" step="0.01" min="0"
               placeholder="e.g. 10.99" required>

        <label for="due_day">Which day of the month is it due?</label>
        <!-- min/max keep the day sensible: between 1 and 31. -->
        <input type="number" id="due_day" name="due_day" min="1" max="31"
               placeholder="e.g. 5" required>

        <button type="submit" class="btn-primary btn-block">Save bill</button>
    </form>

    <a class="back-link" href="{{ url_for('dashboard') }}">&larr; Back to home</a>
</section>

{% endblock %}
