{% extends "base.html" %}
{% block content %}

<section class="form-card">
    <h2>Edit income source</h2>
    <p class="form-intro">Update this income source's details.</p>

    <form method="POST">

        <label for="name">Name</label>
        <input type="text" id="name" name="name"
               value="{{ income.name }}" required>

        <label for="income_type">Income type</label>
        <select id="income_type" name="income_type">
            <option value="fixed" {{ 'selected' if income.income_type == 'fixed' }}>Fixed — same amount every month</option>
            <option value="variable" {{ 'selected' if income.income_type == 'variable' }}>Variable — changes month to month</option>
        </select>

        <label for="frequency">How often is it paid?</label>
        <select id="frequency" name="frequency">
            <option value="monthly" {{ 'selected' if income.frequency == 'monthly' }}>Monthly (e.g. a salary)</option>
            <option value="weekly" {{ 'selected' if income.frequency == 'weekly' }}>Weekly (e.g. weekly wages)</option>
        </select>

        <label for="amount">Expected amount (per month, or per week if weekly)</label>
        <input type="number" id="amount" name="amount" step="0.01" min="0"
               value="{{ income.amount }}" required>

        <button type="submit" class="btn-primary btn-block">Save changes</button>
    </form>

    <a class="back-link" href="{{ url_for('dashboard') }}">&larr; Back to home</a>
</section>

{% endblock %}
