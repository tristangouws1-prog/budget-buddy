{% extends "base.html" %}
{% block content %}

<section class="form-card">
    <h2>Edit income source</h2>
    <p class="form-intro">Update this income source's details.</p>

    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <label for="name">Name</label>
        <input type="text" id="name" name="name"
               value="{{ income.name }}" required>

        <label for="income_type">Income type</label>
        <select id="income_type" name="income_type">
            <option value="fixed" {{ 'selected' if income.income_type == 'fixed' }}>Fixed</option>
            <option value="variable" {{ 'selected' if income.income_type == 'variable' }}>Variable</option>
        </select>

        <label for="category">Category</label>
        <select id="category" name="category">
            {% for c in categories %}
                <option value="{{ c }}" {{ 'selected' if (income.category or 'Other') == c }}>{{ c }}</option>
            {% endfor %}
        </select>

        <label for="frequency">How often is it paid?</label>
        <select id="frequency" name="frequency">
            <option value="monthly" {{ 'selected' if income.frequency == 'monthly' }}>Monthly</option>
            <option value="weekly" {{ 'selected' if income.frequency == 'weekly' }}>Weekly</option>
        </select>

        <label for="amount">Expected amount</label>
        <input type="number" id="amount" name="amount" step="0.01" min="0"
               value="{{ income.amount_cents | rands }}" required>

        <label for="description">Description (optional)</label>
        <p class="form-hint">Who pays it, when it lands, or the reference it comes in with.</p>
        <textarea id="description" name="description" rows="3" maxlength="500"
                  placeholder="e.g. Paid by ACME on the 25th, ref: SALARY NOV">{{ income.description or '' }}</textarea>

        <button type="submit" class="btn-primary btn-block">Save changes</button>
    </form>

    <a class="back-link" href="{{ url_for('dashboard') }}">&larr; Back to home</a>
</section>

{% endblock %}
