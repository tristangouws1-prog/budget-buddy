{% extends "base.html" %}
{% block content %}

<section class="form-card">
    <h2>Settings</h2>
    <p class="form-intro">Customise Budget Buddy</p>
    <form method="POST">
        <!--Currency Symbol-->
        <label for="currency">Currency Symbol</label>
        <select id="currency" name="currency">
            <option value="R" {{ 'selected' if current_user.currency == 'R' }}>R (South African Rand) </option>
            <option value="$" {{ 'selected' if current_user.currency == '$'}}>$ (US Dollar)</option>
            <option value="€" {{ 'selected' if current_user.currency == '€' }}>€ (Euro)</option>
            <option value="£" {{ 'selected' if current_user.currency == '£' }}>£ (British Pound)</option>
        </select>

        <!--Colour theme-->
        <label for="theme">Colour theme</label>
        <select id="theme" name="theme">
            <option value="pastel" {{ 'selected' if current_user.theme == 'pastel' }}>Pastel (light)</option>
            <option value="dark" {{ 'selected' if current_user.theme == 'dark' }}>Dark</option>
        </select>

        <!--Email address + reminder emails-->
        <label for="email">Email address</label>
        <p class="form-hint">Where your bill reminders are sent.</p>
        <input  type="email"
                id="email"
                name="email"
                placeholder="you@example.com"
                value="{{ current_user.email or '' }}"
                required>

        <label class="checkbox-row">
            <input type="checkbox" name="email_reminders"
                   {{ 'checked' if current_user.email_reminders }}>
            Also send my reminders by email
        </label>

        <!--Budget Limit-->
        <label for="budget_limit">Monthly Budget Limit</label>
        <p class="form-hint">Leave empty for no monthly budget limit</p>
        <input  type="number"
                id="budget_limit"
                name="budget_limit"
                step="0.01"
                min="0"
                placeholder="e.g. 4000"
                value="{{ current_user.budget_limit if current_user.budget_limit else '' }}">

        <button class="btn-primary btn-block" type="submit">Save Settings</button>

    </form>
    <a class="back-link" href="{{ url_for('dashboard') }}">&larr; Back to home</a>

</section>
{% endblock %}
