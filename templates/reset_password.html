{% extends "base.html" %}
{% block content %}

<section class="form-card auth-card">
    <h2>Choose a new password</h2>
    <p class="form-intro">Pick a new password for your account.</p>

    <form method="POST">
        <label for="password">New password</label>
        <input type="password" id="password" name="password"
               placeholder="New password" required autofocus>

        <label for="confirm">Confirm new password</label>
        <input type="password" id="confirm" name="confirm"
               placeholder="Type it again" required>

        <!-- tick to see both passwords instead of dots -->
        <label class="checkbox-row">
            <input type="checkbox" onclick="togglePasswords(this.checked)">
            Show password
        </label>

        <button type="submit" class="btn-primary btn-block">Save new password</button>
    </form>
</section>

<script>
function togglePasswords(show) {
    for (const id of ['password', 'confirm']) {
        document.getElementById(id).type = show ? 'text' : 'password';
    }
}
</script>

{% endblock %}
