{% extends "base.html" %}
{% block content %}

<section class="form-card auth-card">
    <h2>Welcome back</h2>
    <p class="form-intro">Log in to see your bills and reminders.</p>

    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label for="username">Email or username</label>
        <input type="text" id="username" name="username"
               placeholder="you@example.com or Name#0001" required autofocus>

        <label for="password">Password</label>
        <input type="password" id="password" name="password"
               placeholder="Your password" required>

        <label class="checkbox-row">
            <input type="checkbox" onclick="togglePasswords(this.checked)">
            Show password
        </label>

        <button type="submit" class="btn-primary btn-block">Log in</button>
    </form>

    <p class="auth-switch">
        New here? <a href="{{ url_for('register') }}">Create an account</a><br>
        <a href="{{ url_for('forgot_password') }}">Forgot your password?</a>
    </p>
</section>

<script>
function togglePasswords(show) {
    document.getElementById('password').type = show ? 'text' : 'password';
}
</script>

{% endblock %}
