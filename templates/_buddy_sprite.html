{# The buddy
#}
{% set sp = sprite_species if sprite_species is defined else (buddy.species if buddy is defined else "blobcat") %}
{% set is_frog = sp in ("frog", "purplefrog") %}

{#Note to self Increase the row where stuff is viewed,
    the which hat doesnt fit #}



<svg viewBox="0 -1 16 16" shape-rendering="crispEdges" aria-hidden="true">
    {% if is_frog %}
    <!-- frog  -->
    <g class="buddy-fill">
        <rect x="3" y="0" width="2" height="3"/>
        <rect x="11" y="0" width="2" height="3"/>
        <rect x="2" y="3" width="12" height="1"/>
        <rect x="1" y="4" width="14" height="9"/>
        <rect x="2" y="13" width="12" height="1"/>
        <rect x="1" y="14" width="4" height="1"/>
        <rect x="11" y="14" width="4" height="1"/>
    </g>

    <!-- belly patch -->
    <g class="buddy-belly-fill">
        <rect x="5" y="10" width="6" height="3"/>
    </g>

    <!--  eyes -->
    <g class="buddy-eyes">
        <g class="buddy-eyes-open">
            <g class="buddy-eye-fill">
                <rect x="3" y="1" width="2" height="2"/>
                <rect x="11" y="1" width="2" height="2"/>
            </g>
            <g class="buddy-ink-fill">
                <rect x="4" y="1" width="1" height="2"/>
                <rect x="11" y="1" width="1" height="2"/>
            </g>
        </g>
        <g class="buddy-eyes-happy">
            <!-- glint in eye -->
            <g class="buddy-eye-fill">
                <rect x="4" y="2" width="1" height="1"/>
                <rect x="11" y="2" width="1" height="1"/>
            </g>
            <g class="buddy-ink-fill">
                <rect x="3" y="2" width="1" height="1"/>
                <rect x="4" y="1" width="1" height="1"/>
                <rect x="11" y="1" width="1" height="1"/>
                <rect x="12" y="2" width="1" height="1"/>
            </g>
        </g>
    </g>

    <!-- eyebrows, when worried -->
    <g class="buddy-brows buddy-ink-fill">
        <rect x="3" y="0" width="2" height="1"/>
        <rect x="11" y="0" width="2" height="1"/>
    </g>

    <!-- nostrils -->
    <g class="buddy-ink-fill">
        <rect x="6" y="5" width="1" height="1"/>
        <rect x="9" y="5" width="1" height="1"/>
    </g>

    <!-- blushy cheeks  -->
    <g class="buddy-cheek-fill">
        <rect x="2" y="7" width="1" height="1"/>
        <rect x="13" y="7" width="1" height="1"/>
    </g>

    <!-- frog grin -->
    <g class="buddy-ink-fill">
        <g class="buddy-mouth-happy">
            <rect x="3" y="8" width="1" height="1"/>
            <rect x="4" y="9" width="8" height="1"/>
            <rect x="12" y="8" width="1" height="1"/>
        </g>
        <g class="buddy-mouth-neutral">
            <rect x="4" y="9" width="8" height="1"/>
        </g>
        <g class="buddy-mouth-worried">
            <rect x="4" y="8" width="8" height="1"/>
            <rect x="3" y="9" width="1" height="1"/>
            <rect x="12" y="9" width="1" height="1"/>
        </g>
    </g>

    {% else %}
    <!-- blob-cat  -->
    <!-- ears -->
    <g class="buddy-fill">
        <rect x="3" y="0" width="1" height="1"/>
        <rect x="3" y="1" width="2" height="1"/>
        <rect x="3" y="2" width="3" height="1"/>
        <rect x="12" y="0" width="1" height="1"/>
        <rect x="11" y="1" width="2" height="1"/>
        <rect x="10" y="2" width="3" height="1"/>
    </g>
    <g class="buddy-cheek-fill">
        <rect x="4" y="2" width="1" height="1"/>
        <rect x="11" y="2" width="1" height="1"/>
    </g>

    <!-- body blob: -->
    <g class="buddy-fill">
        <rect x="3" y="3" width="10" height="1"/>
        <rect x="2" y="4" width="12" height="9"/>
        <rect x="3" y="13" width="10" height="1"/>
        <rect x="4" y="14" width="8" height="1"/>
    </g>

    <!-- eyes  -->
    <g class="buddy-eyes buddy-ink-fill">
        <g class="buddy-eyes-open">
            <rect x="5" y="7" width="1" height="2"/>
            <rect x="10" y="7" width="1" height="2"/>
        </g>
        <g class="buddy-eyes-happy">
            <rect x="4" y="7" width="1" height="1"/>
            <rect x="5" y="6" width="1" height="1"/>
            <rect x="6" y="7" width="1" height="1"/>
            <rect x="9" y="7" width="1" height="1"/>
            <rect x="10" y="6" width="1" height="1"/>
            <rect x="11" y="7" width="1" height="1"/>
        </g>
    </g>

    <!-- eyebrows -->
    <g class="buddy-brows buddy-ink-fill">
        <rect x="4" y="5" width="2" height="1"/>
        <rect x="10" y="5" width="2" height="1"/>
    </g>

    <!-- cheeks -->
    <g class="buddy-cheek-fill">
        <rect x="4" y="10" width="1" height="1"/>
        <rect x="11" y="10" width="1" height="1"/>
    </g>

    <!-- whiskers -->
    <g class="buddy-whisker">
        <rect x="-1" y="7" width="5" height="1"/>
        <rect x="-1" y="9" width="5" height="1"/>
        <rect x="-1" y="11" width="5" height="1"/>
        <rect x="12" y="7" width="5" height="1"/>
        <rect x="12" y="9" width="5" height="1"/>
        <rect x="12" y="11" width="5" height="1"/>
    </g>

    <!-- mouth -->
    <g class="buddy-ink-fill">
        <g class="buddy-mouth-happy">
            <rect x="6" y="10" width="1" height="1"/>
            <rect x="7" y="11" width="2" height="1"/>
            <rect x="9" y="10" width="1" height="1"/>
        </g>
        <g class="buddy-mouth-neutral">
            <rect x="7" y="11" width="2" height="1"/>
        </g>
        <g class="buddy-mouth-worried">
            <rect x="7" y="10" width="2" height="1"/>
            <rect x="6" y="11" width="1" height="1"/>
            <rect x="9" y="11" width="1" height="1"/>
        </g>
    </g>
    {% endif %}

    {% if buddy_equipped is defined %}
    <!-- cosmetics  -->
    {% if "party_hat" in buddy_equipped %}
    <g class="cos-party-hat">
        <rect x="7" y="0" width="1" height="1" fill="#f2c14e"/>
        <rect x="6" y="1" width="3" height="1" fill="#e06a6a"/>
        <rect x="5" y="2" width="5" height="1" fill="#e06a6a"/>
    </g>
    {% endif %}
    {% if "flower" in buddy_equipped %}
    <g class="cos-flower">
        {% if is_frog %}
        <!-- frogs flower on cheek -->
        <rect x="12" y="4" width="1" height="1" fill="#f2a0c0"/>
        <rect x="11" y="5" width="1" height="1" fill="#f2a0c0"/>
        <rect x="13" y="5" width="1" height="1" fill="#f2a0c0"/>
        <rect x="12" y="6" width="1" height="1" fill="#f2a0c0"/>
        <rect x="12" y="5" width="1" height="1" fill="#f2c14e"/>
        {% else %}
        <rect x="11" y="0" width="1" height="1" fill="#f2a0c0"/>
        <rect x="10" y="1" width="1" height="1" fill="#f2a0c0"/>
        <rect x="12" y="1" width="1" height="1" fill="#f2a0c0"/>
        <rect x="11" y="2" width="1" height="1" fill="#f2a0c0"/>
        <rect x="11" y="1" width="1" height="1" fill="#f2c14e"/>
        {% endif %}
    </g>
    {% endif %}
    {% if "top_hat" in buddy_equipped %}
    <g class="cos-top-hat">
        <rect x="5" y="0" width="6" height="3" fill="#3a3a44"/>
        <rect x="5" y="2" width="6" height="1" fill="#e06a6a"/>
        <rect x="4" y="3" width="8" height="1" fill="#3a3a44"/>
    </g>
    {% endif %}
    {% if "witch_hat" in buddy_equipped %}
    <!-- sits one row higher than the other hats note to self, make hat larger -->
    <g class="cos-witch-hat">
        <rect x="7" y="-1" width="1" height="1" fill="#2e2638"/>
        <rect x="6" y="0" width="3" height="1" fill="#2e2638"/>
        <rect x="5" y="1" width="5" height="1" fill="#8a5fc0"/>
        <rect x="7" y="1" width="1" height="1" fill="#f2c14e"/>
        <rect x="3" y="2" width="10" height="1" fill="#2e2638"/>
    </g>
    {% endif %}
    {% if "bow_tie" in buddy_equipped %}
    <g class="cos-bow-tie">
        <rect x="5" y="12" width="2" height="2" fill="#e06a6a"/>
        <rect x="9" y="12" width="2" height="2" fill="#e06a6a"/>
        <rect x="7" y="12" width="2" height="2" fill="#b84a4a"/>
    </g>
    {% endif %}
    {% if "sunglasses" in buddy_equipped %}
    <g class="cos-sunglasses">
        {% if is_frog %}
        <!-- frog's eyes  -->
        <rect x="3" y="1" width="2" height="2" fill="#3a3a44"/>
        <rect x="11" y="1" width="2" height="2" fill="#3a3a44"/>
        <rect x="5" y="2" width="6" height="1" fill="#3a3a44"/>
        {% else %}
        <rect x="4" y="7" width="3" height="2" fill="#3a3a44"/>
        <rect x="9" y="7" width="3" height="2" fill="#3a3a44"/>
        <rect x="7" y="7" width="2" height="1" fill="#3a3a44"/>
        {% endif %}
    </g>
    {% endif %}
    {% if "scarf" in buddy_equipped %}
    <g class="cos-scarf">
        <rect x="4" y="12" width="8" height="1" fill="#6aa8d8"/>
        <rect x="9" y="13" width="2" height="1" fill="#6aa8d8"/>
        <rect x="9" y="14" width="1" height="1" fill="#5188b8"/>
    </g>
    {% endif %}
    {% endif %}
</svg>
