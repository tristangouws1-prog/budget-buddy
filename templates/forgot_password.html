{% extends "base.html" %}
{% block content %}

<section class="form-card auth-card">
    <h2>Forgot your password?</h2>
    <p class="form-intro">Type your email address and we'll send you a link to reset it.</p>

    <form method="POST">
        <label for="email">Email address</label>
        <input type="email" id="email" name="email"
               placeholder="you@example.com" required autofocus>

        <button type="submit" class="btn-primary btn-block">Send reset link</button>
    </form>

    <p class="auth-switch">
        Remembered it after all? <a href="{{ url_for('login') }}">Log in</a>
    </p>
</section>

{% endblock %}
