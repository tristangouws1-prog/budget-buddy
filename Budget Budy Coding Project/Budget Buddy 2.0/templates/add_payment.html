{% extends "base.html" %}
{% block content %}

<section class="form-card">
    <h2>Add a bill or subscription</h2>
    <p class="form-intro">Tell Budget Buddy about a regular payment so it can keep track for you.</p>

    <form method="POST">
        <label for="name">Short name</label>
        <input type="text" id="name" name="name"
               placeholder="e.g. Spotify, Rent, Phone" required>

        <label for="description">Description (optional)</label>
        <input type="text" id="description" name="description"
               placeholder="e.g. Spotify Premium Duo via Vodacom airtime">

        <label for="amount">Amount (R)</label>
        <input type="number" id="amount" name="amount" step="0.01" min="0"
               placeholder="e.g. 199.99" required>

        <label for="due_day">Due day of the month</label>
        <input type="number" id="due_day" name="due_day" min="1" max="31"
               placeholder="e.g. 5" required>

        <button type="submit" class="btn-primary btn-block">Save bill</button>
    </form>

    <a class="back-link" href="{{ url_for('dashboard') }}">&larr; Back to home</a>
</section>

{% endblock %}
