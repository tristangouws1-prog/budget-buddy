{% extends "base.html" %}
{% block content %}

<section class="form-card auth-card">
    <h2>Welcome back</h2>
    <p class="form-intro">Log in to see your bills and reminders.</p>

    <form method="POST">
        <label for="username">Username</label>
        <input type="text" id="username" name="username"
               placeholder="Your username" required autofocus>

        <label for="password">Password</label>
        <input type="password" id="password" name="password"
               placeholder="Your password" required>

        <button type="submit" class="btn-primary btn-block">Log in</button>
    </form>

    <p class="auth-switch">
        New here? <a href="{{ url_for('register') }}">Create an account</a>
    </p>
</section>

{% endblock %}
